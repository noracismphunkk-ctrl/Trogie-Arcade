<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090b;font:14px Arial;color:#fafafa}
nav{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px;background:#18181b;border:1px solid #27272a;border-radius:18px;width:max-content;max-width:calc(100% - 24px);margin:24px auto}
a{display:flex;align-items:center;justify-content:center;gap:9px;padding:12px 16px;color:#a1a1aa;text-decoration:none;border-radius:12px;transition:.2s;white-space:nowrap;min-height:44px}
a:hover,.active{background:#27272a;color:white}
i{width:18px;height:18px;flex-shrink:0}
.settings{border-left:1px solid #3f3f46;margin-left:4px;padding-left:14px}
@media(max-width:480px){
nav{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;width:auto;max-width:none;margin:0;gap:2px;padding:5px;border-radius:16px}
a{flex:1;min-width:0;flex-direction:column;gap:5px;padding:10px 2px;font-size:11px}
a span{display:block}
.settings{border-left:0;margin:0;padding:10px 2px}
}
</style>
</head>
<body>
<nav>
<a href="/Main"><i data-lucide="house"></i><span>Main</span></a>
<a href="/Games"><i data-lucide="gamepad-2"></i><span>Games</span></a>
<a href="/Cloud"><i data-lucide="cloud"></i><span>Cloud</span></a>
<a href="/Settings" class="settings"><i data-lucide="settings"></i><span>Settings</span></a>
</nav>
<script>
lucide.createIcons();
document.querySelectorAll('nav a').forEach(a=>{
if(a.pathname.toLowerCase()===location.pathname.replace(/\/$/,'').toLowerCase())a.classList.add('active');
});
</script>
</body>
</html>
